name: build-test

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Lint Markdown (strict)
        run: npm run lint:md
      - name: Check links in Markdown
        run: npm run lint:links
      - name: Spelling (cspell)
        run: npm run lint:spelling

  test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Must match docker-compose.test.yml: stock postgres has no pgmq, which
        # the M7 dead-letter queue and its tests require.
        image: quay.io/tembo/pg16-pgmq@sha256:7f80d046257d585d1af9d19cf28bd355a4b854b0a7d643c02ebbe6b84457868a
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: db8_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d db8_test"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Prepare DB schema/RPC
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/db8_test
          DB8_TEST_OUTPUT: quiet
        run: npm run test:prepare-db

      # Both passes must run the same set — see ci.yml.
      - name: Run tests (pass 1 — fresh database)
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/db8_test
          DB8_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/db8_test
          DB8_TEST_PG: '1'
          CI: true
        run: npm run test:inner

      # Idempotency plus the DB-gated suites — see the matching step in ci.yml
      # for why both live in one pass and why parallelism is disabled here.
      - name: Run tests (pass 2 — same database, DB-gated, idempotency gate)
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/db8_test
          DB8_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/db8_test
          DB8_TEST_PG: '1'
          CI: true
        run: npx vitest run --no-file-parallelism
