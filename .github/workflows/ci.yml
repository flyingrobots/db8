name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match docker-compose.test.yml. Stock postgres has no pgmq, so the
        # DLQ extension and every test that depends on it fail here while passing
        # locally. Pinned by digest for the same reason the compose file is.
        image: quay.io/tembo/pg16-pgmq@sha256:7f80d046257d585d1af9d19cf28bd355a4b854b0a7d643c02ebbe6b84457868a
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: db8_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - name: Block TypeScript files
        run: |
          if git ls-files | grep -E '\\.(ts|tsx)$'; then
            echo "TypeScript files detected. Not allowed."; exit 1;
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci || (echo "npm ci failed; retrying clean install" && rm -rf node_modules package-lock.json && npm install)

      - name: Install web deps
        run: |
          npm ci --prefix web || (echo "web npm ci failed; retrying clean install" && rm -rf web/node_modules web/package-lock.json && npm --prefix web install)

      - name: Detect path changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'web/**'
              - 'public/**'
              - 'eslint.config.js'
              - 'web/package.json'
              - 'web/package-lock.json'

      - name: Lint
        run: npm run lint

      - name: Build Web (Next.js)
        if: github.event_name == 'push' || steps.changes.outputs.web == 'true'
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm --prefix web run build

      - name: DB setup
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:54329/db8_test
          DB8_TEST_OUTPUT: quiet
        # Use the same preparer the local harness and build-test.yml use, rather
        # than a bespoke psql invocation. The old form applied only schema.sql and
        # rpc.sql — never db/rls.sql, so every RLS policy in the repo went
        # unexercised by the CI that gates merges — and ran psql without
        # ON_ERROR_STOP, so failing statements were reported as success and the
        # suite then ran against a partially built database. `|| true` on rpc.sql
        # swallowed the rest.
        run: npm run test:prepare-db

      # Both passes must run the same set, or the extra DB-gated suites are
      # only ever exercised against a dirty database and pass 2 is comparing
      # against a different suite than pass 1.
      - name: Tests (pass 1 — fresh database)
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:54329/db8_test
          DB8_TEST_DATABASE_URL: postgresql://postgres:test@localhost:54329/db8_test
          DB8_TEST_PG: '1'
        run: npm test

      # Pass 2 carries two gates at once.
      #
      # Idempotency: the postgres service persists across steps, so this reuses
      # the database pass 1 left behind — the only way to catch a test that
      # silently depends on starting from empty. Three real bugs lived in that
      # blind spot, including a schema contradiction that made audited
      # participants permanently undeletable.
      #
      # DB8_TEST_PG unlocks six DB-gated suites that no workflow ran, which is
      # how a journal endpoint that answered idx=999 with the latest round
      # reached main. They run in parallel with everything else: their
      # fixtures are self-scoped now.
      - name: Tests (pass 2 — same database, DB-gated, idempotency gate)
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:54329/db8_test
          DB8_TEST_DATABASE_URL: postgresql://postgres:test@localhost:54329/db8_test
          DB8_TEST_PG: '1'
        run: npm run test:inner

      - name: Tests (Postgres RPC integration)
        env:
          RUN_PGTAP: '1'
          DATABASE_URL: postgresql://postgres:test@localhost:54329/db8_test
          DB8_TEST_DATABASE_URL: postgresql://postgres:test@localhost:54329/db8_test
        run: npx vitest run server/test/rpc.db.postgres.test.js

      - name: pgTAP (optional)
        if: ${{ vars.RUN_PGTAP == '1' || github.event.inputs.run_pgtap == '1' }}
        env:
          PGURL: postgresql://postgres:test@localhost:54329/db8_test
        run: |
          if [ -f "db/test/run.sh" ]; then
            chmod +x db/test/run.sh
            ./db/test/run.sh
          else
            echo "pgTAP test script not found, skipping"
          fi

  conventional-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
